services:
  # 1. Database (UNCHANGED)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data_prod:/var/lib/postgresql/data

  # 2. Backend API
  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RUST_LOG: info
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}  # <--- Add this line here
    # REMOVED "ports" section. Only Caddy talks to it now.

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      args:
        # UPDATED: Now points to the domain, not the IP
        NEXT_PUBLIC_API_URL: https://planner.evolutesix.com
    restart: always
    # REMOVED "ports" section. Only Caddy talks to it now.

  # 4. Caddy (NEW SERVICE)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db_data_prod:
  caddy_data:    # Stores SSL certs
  caddy_config:
